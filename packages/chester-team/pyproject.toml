[project]
name = "chester-team"
version = "0.1.8"
description = "Chester as a team — the orchestrator variant, sibling of chester-agent (scaffold)"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "chester-geo-tools",
]

[tool.uv.sources]
chester-geo-tools = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.0,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "chester"
module-root = ""
namespace = true
