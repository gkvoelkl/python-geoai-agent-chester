[project]
name = "chester-mcp"
version = "0.1.8"
description = "Chester-MCP — the geo tools for a foreign client, over stdio"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "chester-geo-tools",
    "fastmcp-slim[server]>=4.0.0",
]

[tool.uv.sources]
chester-geo-tools = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.0,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "chester"
module-root = ""
namespace = true
