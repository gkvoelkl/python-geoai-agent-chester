[project]
name = "python-geoai-agent-chester"
version = "0.1.8"
description = "Chester — a local, model-agnostic Geo-AI agent (SelmaKit + QGIS + Ollama)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
# The application: CLI entry points, gateway, bench (ask.py, gateway.py, evals.py,
# test_app.py, ...). The library lives in four workspace packages under packages/,
# all contributing to the namespace package `chester`; see doc/code-map.md.
dependencies = [
    "chester-geo-tools",
    "chester-runtime",
    "chester-agent",
    "chester-mcp",
    "chester-team",
    "python-dotenv>=1.2.2",
    "streamlit>=1.58.0",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
chester-geo-tools = { workspace = true }
chester-runtime = { workspace = true }
chester-agent = { workspace = true }
chester-mcp = { workspace = true }
chester-team = { workspace = true }

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]
harenessa = [
    "rich>=15.0.0",
]

[tool.ruff]
# 100, nicht 88: der Bestand ist auf ~88-90 geschrieben (P95 = 84, P99 = 91), ein
# strengerer Wert erzeugte eine Fehlerwand aus Altbestand statt eines Signals.
line-length = 100
target-version = "py313"
extend-exclude = ["cache", ".chester", "mutants"]

[tool.ruff.lint]
# Bewusst klein anfangen (H1): E/F/I fassen echte Fehler und Importordnung.
# Dazu die vier KI-Fehlermuster aus Boeckelers Praxisbericht - sie sind in keinem
# Standard-Preset aktiv, und genau sie produzieren Agenten.
select = ["E", "F", "I", "PLR0913", "PLR0915", "C901"]

[tool.ruff.lint.isort]
# `chester` is a namespace package installed from packages/*, so ruff would file it
# under third-party and reorder every import block. It is this repository's own code.
known-first-party = ["chester"]

[tool.ruff.lint.pylint]
max-args = 8
max-statements = 60

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# `get_toolset` haelt saemtliche Tools einer Capability als verschachtelte Defs -
# Laenge und Komplexitaet messen dort die Anzahl der Werkzeuge, nicht verworrenen
# Code. Ohne diese Ausnahme ist die Regel Laerm (gemessen: 11 der 60 Treffer).
"packages/chester-agent/chester/capabilities/*.py" = ["PLR0915", "C901"]
"packages/chester-runtime/chester/runtime/*.py" = ["PLR0915", "C901"]
# Dieselbe Begruendung, seit die Huellen aus den Capabilities herauswandern
# (Phase KM, Schritt 1): `chester/*tools.py` sind Fabriken, die saemtliche
# Werkzeuge einer Gruppe als verschachtelte Defs halten. Die Zahl misst dort
# Werkzeuge, keine Verzweigungen - `build_tools` hat keinen einzigen Zweig.
"packages/*/chester/*tools.py" = ["PLR0915", "C901"]

[tool.mypy]
# Absichtlich milde: Die Geo-Bibliotheken (rasterio, geopandas, osmnx, cjio, pdal)
# liefern keine oder unvollstaendige Stubs; ohne diese Zeile pruefte mypy vor allem
# fremde Pakete statt Chesters Code.
ignore_missing_imports = true
python_version = "3.13"
exclude = ["^(cache|\\.chester|harenessa|postgis_test_db)/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
